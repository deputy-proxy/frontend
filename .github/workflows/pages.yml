name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Include replication artifacts
        run: |
          mkdir -p dist/replications
          cp -R replications/verdentix dist/replications/
          cp -R replications/investflowtemplate-webflow-io-home-pages-home-v3 dist/replications/
          cp -R replications/neurex dist/replications/
          mkdir -p dist/replications/kora
          cp -R replications/kora/source dist/replications/kora/
          cp -R replications/kora/iterations dist/replications/kora/
          cp replications/kora/README.md dist/replications/kora/
          mkdir -p dist/replications/organiccare
          cp -R replications/organiccare/source dist/replications/organiccare/
          cp -R replications/organiccare/iterations dist/replications/organiccare/
          cp replications/organiccare/README.md dist/replications/organiccare/
          mkdir -p dist/replications/stripe
          cp -R replications/stripe/source dist/replications/stripe/
          cp -R replications/stripe/iterations dist/replications/stripe/
          cp replications/stripe/README.md dist/replications/stripe/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5