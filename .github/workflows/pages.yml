name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install

      - name: Compile Altrum Tailwind CSS
        run: |
          npx vite build --config replications/altrum-template/implementation/vite.config.js
          cp replications/altrum-template/.tailwind-build/tailwind.compiled.css replications/altrum-template/implementation/src/css/tailwind.compiled.css

      - name: Build
        run: npm run build

      - name: Include replication artifacts
        run: |
          mkdir -p dist/replications
          cp -R replications/verdentix dist/replications/
          cp -R replications/synexsystem dist/replications/
          cp -R replications/altrum-template dist/replications/
          cp -R replications/investflowtemplate-webflow-io-home-pages-home-v3 dist/replications/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5